version: "3.9"

services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vspec:vspec@db:5432/vspec}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      VSPEC_AUTH_STUB: ${VSPEC_AUTH_STUB:-}
      PORT: "8080"
    ports:
      - "${VSPEC_DEPLOY_HOST_PORT:-4400}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vspec
      POSTGRES_PASSWORD: vspec
      POSTGRES_DB: vspec
    volumes:
      - vspec_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vspec -d vspec"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vspec_prod_db:

packages:
  - "apps/*"
  - "packages/*"
overrides:
  # CVE-2026-54290: hono CORS middleware reflects any Origin with credentials.
  # hono is transitive (via @modelcontextprotocol/sdk → @hono/node-server);
  # force the patched release. Fixed in 4.12.25.
  hono: ">=4.12.25"
  # Medium+ advisory floor from Trivy/pnpm audit (2026-07-09).
  "gray-matter>js-yaml": "3.15.0"
  "@vitest/mocker>vite": "8.1.4"
  "@babel/core": "7.29.6"
  esbuild: "0.28.1"
  js-yaml: "4.2.0"
  postcss: "8.5.16"
  qs: "6.15.3"
  "vitest>vite": "8.1.4"
  yaml: "2.9.0"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  msw: true
  prisma: true
  sharp: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vspec
          POSTGRES_PASSWORD: vspec
          POSTGRES_DB: vspec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vspec -d vspec_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vspec:vspec@localhost:5432/vspec_test
      TEST_DATABASE_URL: postgresql://vspec:vspec@localhost:5432/vspec_test
      VSPEC_AUTH_STUB: "1"
      # Skip the _meta gate suite in completion-check.sh — the cross-cutting
      # claims (lint, typecheck, vitest + coverage, app builds) are enforced
      # by the explicit workflow steps below, where each appears as its own
      # Actions UI line for faster debugging.
      VSPEC_GATES_SKIP_META: "1"
      # Skip deep gates that require unavailable infrastructure on the
      # default runner — Playwright browsers (goal 8.D5), Docker deploy
      # (goals 2.B3 and 3.B4), Vercel CLI auth (goal 8.E3/E4).
      VSPEC_GATES_SKIP_DEEP: "1"
      # ubuntu-latest is a 2-vCPU runner; matching concurrency avoids
      # CPU contention when goal workers spawn their own multi-threaded
      # tools (tsc, vitest).
      VSPEC_GATES_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Restore goal gate cache
        uses: actions/cache@v4
        with:
          path: .state/gate-cache
          key: ${{ runner.os }}-gate-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gate-cache-
      - run: pnpm install --frozen-lockfile
      # _meta M.2 — strict lint. `pnpm run lint` calls the root script
      # which is `eslint . --max-warnings 0`, matching _meta.gates.sh.
      - name: Lint
        run: pnpm run lint
      # _meta M.1 — typecheck.
      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck
      # _meta M.4 — every workspace app with a `build` script builds.
      # `pnpm -r build` enumerates apps via pnpm-workspace.yaml and skips
      # packages without a build script. Must run BEFORE the test step:
      # apps/api/tests/integration/dogfood-test.test.ts consumes the build
      # output (dist/scripts/dogfood-smoke.js) and asserts the script does
      # not rebuild it, so the artifact must already exist when vitest runs.
      - name: Build all workspace apps
        run: pnpm -r build
      # _meta M.3 — vitest with coverage thresholds (subsumes plain test).
      - name: Test + coverage
        run: pnpm run test:coverage
      # Goal-local gates only (meta skipped via env above).
      - name: Run goal gate sweep
        run: bash scripts/completion-check.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vspec
          POSTGRES_PASSWORD: vspec
          POSTGRES_DB: vspec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vspec -d vspec_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vspec:vspec@localhost:5432/vspec_test
      TEST_DATABASE_URL: postgresql://vspec:vspec@localhost:5432/vspec_test
      VSPEC_AUTH_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: bash scripts/completion-check.sh

name: Vspec Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vspec-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vspec-verify:
    if: ${{ vars.VSPEC_VERIFY_USECASE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.0.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Vooster verify
        id: verify
        uses: ./
        with:
          usecase-key: ${{ vars.VSPEC_VERIFY_USECASE }}
          test-command: "${{ vars.VSPEC_VERIFY_TEST_COMMAND || 'pnpm test' }}"
          api-url: ${{ vars.VSPEC_API_URL }}
          session-cookie: ${{ secrets.VSPEC_SESSION_COOKIE }}
          unlinked-policy: fail
      - name: Comment verify failure
        if: ${{ github.event_name == 'pull_request' && failure() && steps.verify.outcome == 'failure' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require("node:fs");
            const exitCode = "${{ steps.verify.outputs.exit_code }}";
            const logPath = "${{ steps.verify.outputs.log_path }}";
            const log = fs.existsSync(logPath)
              ? fs.readFileSync(logPath, "utf8").slice(-12000)
              : "(no verify log captured)";
            const body = [
              "Vooster spec-code verification failed.",
              "",
              `Exit code: ${exitCode || "unknown"}`,
              "",
              "```text",
              log,
              "```"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

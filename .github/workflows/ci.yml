name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vspec
          POSTGRES_PASSWORD: vspec
          POSTGRES_DB: vspec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vspec -d vspec_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vspec:vspec@localhost:5432/vspec_test
      TEST_DATABASE_URL: postgresql://vspec:vspec@localhost:5432/vspec_test
      VSPEC_AUTH_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: bash scripts/completion-check.sh

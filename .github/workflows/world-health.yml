name: World Health

# scripts/world-check.sh calls completion-check.sh with deep Docker/Postgres
# gates enabled. This workflow intentionally has no postgres service because
# the world-state checks own their own external resources.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: world-health
  cancel-in-progress: false

jobs:
  world-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VSPEC_AUTH_STUB: "1"
      VSPEC_GATES_CONCURRENCY: "2"
      VSPEC_WORLD_RETRY_DELAY_SECONDS: "30"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Mask Vercel token
        if: env.VERCEL_TOKEN != ''
        run: echo "::add-mask::${VERCEL_TOKEN}"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.0.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
      - name: Install world-check gate tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: pnpm install --frozen-lockfile
      - name: Add pinned Vercel CLI wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec pnpm dlx vercel@54.21.1 "$@"' > "$RUNNER_TEMP/bin/vercel"
          chmod +x "$RUNNER_TEMP/bin/vercel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify pinned Vercel CLI wrapper
        run: |
          "$RUNNER_TEMP/bin/vercel" --version
      - name: Run world-state checks
        id: world
        continue-on-error: true
        run: bash scripts/world-check.sh 2>&1 | tee world-check.log
      - name: Upload world-check log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-check-log
          path: world-check.log
      - name: Open or update world-health issue
        if: steps.world.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require("node:fs");
            const title = "World health check failed";
            const label = "world-health";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const log = fs.readFileSync("world-check.log", "utf8").slice(-12000);
            const body = [
              "The scheduled world-state suite failed twice in a row.",
              "",
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
              "",
              "```text",
              log,
              "```"
            ].join("\n");
            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: "0e8a16",
                  description: "Automated world-health check failures"
                });
              }
            }
            await ensureLabel();
            const { data: issues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue label:world-health`
            });
            const existing = issues.items.find((issue) => issue.title === title);
            if (existing === undefined) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              if (existing.state !== "open") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "open"
                });
              }
            }
      - name: Fail workflow after reporting
        if: steps.world.outcome == 'failure'
        run: exit 1
